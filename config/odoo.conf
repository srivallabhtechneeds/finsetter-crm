[options]
; ---------------------------------------------------------------------------
; Finsetter CRM - Odoo server configuration
; ---------------------------------------------------------------------------
admin_passwd = finsetter_admin_change_me
db_host = db
db_port = 5432
db_user = odoo
db_password = finsetter_secure_pw_change_me
db_name = finsetter_crm
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
list_db = False
proxy_mode = True
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
; workers = 0 (threaded mode): serves HTTP *and* the live-update websocket on
; port 8069. With workers > 0 the websocket only listens on gevent_port 8072,
; which requires a reverse proxy routing /websocket there — without one the
; browser keeps reconnecting ("Connection lost" flicker every ~30s).
workers = 0
max_cron_threads = 1
log_level = info
