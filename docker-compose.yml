services:
  db:
    image: postgres:15
    container_name: finsetter_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ODOO_DB_NAME:-finsetter_crm}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    volumes:
      - finsetter_db_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finsetter_net

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ODOO_VERSION: ${ODOO_VERSION:-19.0}
    container_name: finsetter_crm_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8069}:8069"
      - "${LONGPOLLING_PORT:-8072}:8072"
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - finsetter_odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - odoo_logs:/var/log/odoo
    # First boot: create the DB, load demo-free base data and install the
    # finsetter_crm module (and its dependencies) automatically.
    # Safe to leave in place on restarts — Odoo skips already-installed
    # modules and only applies pending upgrades.
    command: >
      odoo
      -c /etc/odoo/odoo.conf
      -d finsetter_crm
    networks:
      - finsetter_net

networks:
  finsetter_net:
    driver: bridge

volumes:
  finsetter_db_data:
  finsetter_odoo_data:
  odoo_logs:
